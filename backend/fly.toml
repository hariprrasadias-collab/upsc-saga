app = "upsc-saga-backend-REPLACE_ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "sqlite_data"
  destination = "/data"

[env]
  DATABASE_PATH = "/data/upsc_saga.db"
