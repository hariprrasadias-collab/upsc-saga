services:
  # Backend Service (Docker)
  - type: web
    name: upsc-saga-backend
    env: docker
    rootDir: backend
    plan: free
    branch: main
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000

  # Frontend Service (Static Site)
  - type: web
    name: upsc-saga-frontend
    env: static
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    plan: free
    branch: main
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: upsc-saga-backend
          property: url
