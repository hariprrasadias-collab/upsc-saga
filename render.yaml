services:
  - type: web
    name: upsc-saga
    env: python
    buildCommand: pnpm install --frozen-lockfile --dir frontend && cd frontend && pnpm build && cd .. && pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:10000 backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.10.0
