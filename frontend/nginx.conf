server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # When using Docker Compose, the backend hostname is 'backend'
    # When deploying to Render/others, this might need adjustment if they are separate services.
    # But for a Docker-based deployment where they are in the same network (Render Blueprint or Docker Compose), this works.
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
